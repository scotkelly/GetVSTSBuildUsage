name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore, build, and test
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5.2 Developer Pack
        run: choco install netfx-4.5.2-devpack -y --no-progress

      - name: Restore NuGet packages
        run: nuget restore GetVSTSBuildUsage.sln -NonInteractive

      - name: Build solution
        run: msbuild GetVSTSBuildUsage.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Run tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find **\Common7\IDE\Extensions\TestPlatform\vstest.console.exe | Select-Object -First 1
          if (-not $vstest) {
            throw "vstest.console.exe was not found on the runner."
          }

          & $vstest `
            GetVSTSBuildUsage.Tests\bin\Release\GetVSTSBuildUsage.Tests.dll `
            /TestAdapterPath:packages\MSTest.TestAdapter.2.2.10\build\_common
