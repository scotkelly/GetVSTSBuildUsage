name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '21 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5.2 Developer Pack
        run: choco install netfx-4.5.2-devpack -y --no-progress

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore NuGet packages
        run: nuget restore GetVSTSBuildUsage.sln -NonInteractive

      - name: Build solution
        run: msbuild GetVSTSBuildUsage.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
